
name: Deploy CloudOps Health Monitor to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ufuomaorieruo/cloudops-health-monitor:latest
            ufuomaorieruo/cloudops-health-monitor:${{ github.sha }}

      - name: Deploy to Azure VM over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            sudo docker pull ufuomaorieruo/cloudops-health-monitor:${{ github.sha }}
            sudo docker stop cloudops-dashboard || true
            sudo docker rm cloudops-dashboard || true
            sudo docker run -d \
              --name cloudops-dashboard \
              --restart unless-stopped \
              -p 80:3000 \
              ufuomaorieruo/cloudops-health-monitor:${{ github.sha }}
            sleep 5
            curl --fail http://localhost/health
